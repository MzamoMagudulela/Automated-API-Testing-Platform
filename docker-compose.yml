version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api_testlab_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./api_testlab.db
      - ALLOW_PRIVATE_IPS=true
      - MAX_TIMEOUT_SECONDS=120
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: api_testlab_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
